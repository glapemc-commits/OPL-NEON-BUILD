name: Build Open PS2 Loader ELF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q Open-PS2-Loader-NEON-Android-build.zip -d source

      - name: Compile OPL
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source/Open-PS2-Loader-1.1.0:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -c "make -j4"

      - name: Collect ELF
        run: |
          mkdir -p dist
          find source -type f -iname "*.elf" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: OPNPS2LD-ELF
          path: dist/
          if-no-files-found: error
